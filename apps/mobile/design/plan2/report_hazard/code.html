<script>
  let timeLeft = 5000;
  const totalTime = 5000;
  const intervalStep = 100;
  const progressBar = document.getElementById('countdown-progress');
  const countNum = document.getElementById('countdown-num');
  let timerId = null;

  function updateTimer() {
    timeLeft -= intervalStep;
    if (timeLeft <= 0) {
      clearInterval(timerId);
      if (progressBar) progressBar.style.width = '0%';
      if (countNum) countNum.textContent = '0';
      completeReport();
      return;
    }
    const percent = (timeLeft / totalTime) * 100;
    if (progressBar) progressBar.style.width = percent + '%';
    if (countNum) countNum.textContent = Math.ceil(timeLeft / 1000);
  }

  timerId = setInterval(updateTimer, intervalStep);

  function resetTimer() {
    timeLeft = totalTime;
    if (progressBar) progressBar.style.width = '100%';
    if (countNum) countNum.textContent = '5';
  }

  function selectIncident(element, name) {
    resetTimer();
    const cards = document.querySelectorAll('.incident-card');
    cards.forEach(card => {
      card.classList.remove('is-selected', 'bg-surface-container-low');
      card.classList.add('bg-surface-container-lowest');
      const iconWrap = card.querySelector('div');
      const title = card.querySelector('span:last-child');
      if (iconWrap) {
        iconWrap.className = 'w-11 h-11 rounded-full bg-surface-container-high flex items-center justify-center text-primary-container mb-1.5 transition-colors group-hover:bg-secondary-container';
        const icon = iconWrap.querySelector('.material-symbols-outlined');
        if (icon) icon.style.fontVariationSettings = "'FILL' 0";
      }
      if (title) {
        title.className = 'font-label-lg text-label-lg text-on-surface font-medium';
      }
    });

    element.classList.add('is-selected', 'bg-surface-container-low');
    element.classList.remove('bg-surface-container-lowest');
    const selectedIconWrap = element.querySelector('div');
    const selectedTitle = element.querySelector('span:last-child');
    if (selectedIconWrap) {
      selectedIconWrap.className = 'w-11 h-11 rounded-full bg-primary-container text-on-primary flex items-center justify-center mb-1.5 transition-colors';
      const icon = selectedIconWrap.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 1";
    }
    if (selectedTitle) {
      selectedTitle.className = 'font-label-lg text-label-lg text-primary font-semibold';
    }
  }

  function setDirection(btn) {
    resetTimer();
    const buttons = document.querySelectorAll('.dir-btn');
    buttons.forEach(b => {
      b.className = 'dir-btn py-2 px-3 rounded-lg text-secondary hover:text-on-surface font-label-lg text-label-lg text-center transition-all';
    });
    btn.className = 'dir-btn py-2 px-3 rounded-lg bg-surface-container-lowest shadow-sm text-on-surface font-label-lg text-label-lg text-center transition-all';
  }

  function setLane(btn) {
    resetTimer();
    const buttons = document.querySelectorAll('.lane-btn');
    buttons.forEach(b => {
      b.className = 'lane-btn min-h-[44px] py-2 px-2 rounded-lg bg-surface-container-high text-on-surface font-label-sm text-label-sm text-center flex items-center justify-center transition-all';
    });
    btn.className = 'lane-btn min-h-[44px] py-2 px-2 rounded-lg bg-primary-container text-on-primary font-label-sm text-label-sm text-center flex items-center justify-center shadow-sm transition-all font-semibold';
  }

  function completeReport() {
    clearInterval(timerId);
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    if (submitBtn && submitText) {
      submitBtn.disabled = true;
      submitBtn.classList.remove('bg-primary-container');
      submitBtn.classList.add('bg-primary');
      submitText.textContent = 'Report Published! Returning...';
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 900);
    }
  }

  const noteInput = document.getElementById('hazard-note');
  if (noteInput) {
    noteInput.addEventListener('focus', () => {
      clearInterval(timerId);
      if (progressBar) progressBar.style.width = '0%';
      const autoTag = countNum ? countNum.parentElement : null;
      if (autoTag) autoTag.style.opacity = '0.3';
    });
  }
</script></main></body></html>
